<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 760" role="img">
<title>Nucleo-32 G431KB pinout for UART to S.BUS wiring with D12 error LED</title>
<desc>USB at top. UART in on D0 (CN4 pin 2, USART1 RX PA10). S.BUS out on D13 (CN3 pin 15, USART2 TX PB3). Red error LED on D12 (CN4 pin 15, GPIO PB4 open-drain to 5 V). Console is ST-Link USB, not Arduino D0/D1.</desc>
<rect width="780" height="760" fill="#f7fafc"/>
<rect x="260" y="70" width="260" height="620" rx="10" fill="#03234b" stroke="#021526" stroke-width="2"/>
<rect x="355" y="56" width="70" height="28" rx="3" fill="#cbd5e0" stroke="#4a5568"/>
<text x="390" y="118" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">NUCLEO-32</text>
<text x="390" y="136" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#90cdf4">STM32G431KB</text>
<rect x="330" y="270" width="120" height="90" rx="4" fill="#1a202c"/>
<text x="390" y="320" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#a0aec0">MCU</text>
<circle cx="390" cy="654" r="12" fill="#c53030" stroke="#742a2a"/>
<text x="390" y="676" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#e2e8f0">RESET</text>
<text x="390" y="156" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#90cdf4">CN1 USB ST-LINK console (VCP)</text>
