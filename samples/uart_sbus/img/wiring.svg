<circle cx="522" cy="498" r="5.5" fill="#edf2f7" stroke="#f7fafc" stroke-width="1.5"/>
<text x="504" y="502" text-anchor="end" font-family="sans-serif" font-size="11" fill="#e2e8f0">A1</text>
<circle cx="522" cy="532" r="5.5" fill="#edf2f7" stroke="#f7fafc" stroke-width="1.5"/>
