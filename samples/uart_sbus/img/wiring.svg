<circle cx="522" cy="396" r="5.5" fill="#edf2f7" stroke="#f7fafc" stroke-width="1.5"/>
<text x="504" y="400" text-anchor="end" font-family="sans-serif" font-size="11" fill="#e2e8f0">A4</text>
<circle cx="522" cy="430" r="5.5" fill="#edf2f7" stroke="#f7fafc" stroke-width="1.5"/>
<text x="504" y="434" text-anchor="end" font-family="sans-serif" font-size="11" fill="#e2e8f0">A3</text>
