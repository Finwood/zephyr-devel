<text x="536" y="634" text-anchor="start" dominant-baseline="central" font-family="sans-serif" font-size="13" font-weight="700" fill="#6b46c1">S.BUS out</text>
<text x="536" y="654" text-anchor="start" font-family="sans-serif" font-size="11" fill="#6b46c1">USART2 TX PB3 inv. 8E2</text>
<text x="390" y="740" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4a5568">USB at top. Console is ST-Link VCP, not D0/D1. Tie companion, Nucleo, and S.BUS GND together.</text>
