<text x="276" y="230" font-family="sans-serif" font-size="11" fill="#e2e8f0">NRST</text>
<circle cx="258" cy="260" r="5.5" fill="#4a5568" stroke="#f7fafc" stroke-width="1.5"/>
<text x="276" y="264" font-family="sans-serif" font-size="11" fill="#e2e8f0">GND</text>
