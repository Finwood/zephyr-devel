source [find interface/stlink.cfg]
transport select hla_swd

source [find target/stm32c0x.cfg]

# PF2-NRST is routed to the debug connector. Force hardware reset after
# stm32c0x.cfg (which selects sysresetreq for non-HLA sessions).
reset_config srst_nogate
cortex_m reset_config srst
