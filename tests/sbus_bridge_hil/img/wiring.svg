  <title
     id="title1">Nucleo-32 G431KB pinout for sbus_bridge HIL wiring</title>
  <desc
     id="desc1">USB at top. USART1 TX on D6 (PB6). USART2 RX on D12 (PB4, rx-invert). Local jumpers D6-A0 and D12-A1 for TIM2 capture. Status LEDs: green D11 and red D10, open-drain to +5 V. For sbus_bridge: D6 to PA1, D12 to PA4. Console is ST-Link USB.</desc>
